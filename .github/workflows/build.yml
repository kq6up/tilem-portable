name: Portable builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgtk2.0-dev libusb-1.0-0-dev libticalcs-dev libticables-dev libtifiles-dev libticonv-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkgconf gtk+ glib libusb libarchive
          scripts/bootstrap-tilibs.sh -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=$PWD/.deps/prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Compile native GUI, core and bridge
        run: scripts/build.sh -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$PWD/_install"
      - name: Stage installation
        run: cmake --install build
  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile with pkgsrc dependencies on NetBSD 10.1
        uses: vmactions/netbsd-vm@1d9767765fd3f986e6de3aff4b1148f0c3a45f01 # v1.4.1
        with:
          release: '10.1'
          usesh: true
          prepare: sh scripts/ci-netbsd-deps.sh
          run: |
            export PATH="/usr/pkg/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig
            scripts/build.sh -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH=/usr/pkg -DCMAKE_INSTALL_PREFIX="$PWD/_install"
            cmake --install build
  slackware-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile core in Slackware 15.0
        run: |
          docker run --rm -v "$PWD:/source" -w /source aclemons/slackware:15.0 sh -ec '
            slackpkg -batch=on -default_answer=y update
            # slackpkg does not resolve dependencies; include CMake/libcurl and GNU Make/Guile runtimes.
            slackpkg -batch=on -default_answer=y install cmake gcc gcc-g++ make binutils flex glibc kernel-headers gmp mpfr libmpc libarchive libuv rhash openssl zlib bzip2 xz lz4 zstd libxml2 nghttp2 c-ares libidn2 libunistring openldap cyrus-sasl libssh2 libpsl brotli krb5 e2fsprogs keyutils guile gc libffi readline ncurses libtool
            ldd /usr/bin/cmake
            ldd /usr/bin/make
            ldd /usr/bin/ar
            ldd /usr/bin/ld
            cmake --version
            make --version
            ar --version
            ld --version
            scripts/build.sh -DTILEM_BUILD_GTK=OFF -DBUILD_TESTING=OFF
          '
